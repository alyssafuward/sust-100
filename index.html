<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>100 Posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --pale: #F2F8FD; --mid: #C8DEF0; --deep: #1F6FA8; --ink: #1A1A1A; --grey: #666; --rule: #D8ECF8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pale); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; }
  canvas { display: block; touch-action: manipulation; }
  button { font: inherit; cursor: pointer; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--deep); }
  .btn { background: var(--deep); color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; }
  .ghost { background: rgba(255,255,255,.85); color: var(--deep); border: 1.5px solid var(--deep); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 13px; }
  .ghost[aria-pressed="true"] { background: var(--deep); color: #fff; }

  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .count { background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 14px; box-shadow: 0 1px 0 var(--rule); }
  .count b { font-size: 16px; color: var(--deep); }
  .spacer { flex: 1; }
  .btns { display: flex; gap: 8px; }

  #bar { position: fixed; left: 0; right: 0; bottom: 0; min-height: 68px; display: flex; align-items: center; gap: 12px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--rule); }
  #article { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
  #article .text { flex: 1; min-width: 0; }
  #article .title { font-family: "DM Serif Display", serif; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #article .hint { color: var(--grey); font-size: 14px; }
  #article a.btn { text-decoration: none; font-size: 14px; padding: 8px 14px; white-space: nowrap; }
  #controls { display: flex; gap: 6px; }
  #controls button { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--deep); background: #fff; color: var(--deep); font-size: 16px; font-weight: 700; user-select: none; -webkit-user-select: none; }
  #controls #jumpBtn { width: 64px; border-radius: 22px; font-size: 14px; }
  #versionsBtn { flex: none; margin-left: 8px; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--rule); color: var(--grey); display: grid; place-items: center; font: italic 700 17px Georgia, serif; text-decoration: none; }
  #controls [hidden], #controls[hidden] { display: none; }
  @media (max-width: 560px) { #article .title { font-size: 16px; } #article .eyebrow { display: none; } }

  .overlay { position: fixed; inset: 0; background: rgba(242,248,253,.92); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .overlay[hidden], #end[hidden] { display: none; }
  .panel { background: #fff; border-radius: 20px; padding: 28px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 6px 30px rgba(31,111,168,.15); }
  .panel h1 { font-family: "DM Serif Display", serif; font-weight: 400; font-size: 44px; margin: 8px 0; }
  .panel p { color: var(--grey); line-height: 1.5; }
  .keys { font-size: 13px; color: var(--grey); margin-top: 16px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  #warp .panel { background: none; box-shadow: none; }

  #end { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); padding: 16px 20px; }
  #end h1 { font-size: 32px; margin: 4px 0; }
  #end p { margin: 4px 0; }

  .menu { position: fixed; top: 56px; right: 16px; z-index: 20; width: min(300px, calc(100vw - 32px)); background: #fff; border-radius: 16px; padding: 8px; box-shadow: 0 8px 28px rgba(31,111,168,.2); }
  .menu[hidden] { display: none; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px; background: none; text-align: left; font-size: 15px; color: var(--ink); }
  .menu button:hover, .menu button:focus-visible { background: var(--pale); }
  .menu button.here { background: var(--pale); font-weight: 600; }
  .menu .ic { width: 22px; text-align: center; }
  .menu .nm { flex: 1; }
  .menu .ct { color: var(--deep); font-weight: 600; font-size: 13px; }
  #gallery { align-items: stretch; }
  #gallery .sheet { background: #fff; border-radius: 20px; max-width: 760px; width: 100%; margin: auto; max-height: 100%; overflow: auto; padding: 24px; }
  #gallery .top { display: flex; justify-content: space-between; align-items: center; position: sticky; top: -24px; background: #fff; padding: 8px 0; }
  #gallery h2 { font-family: "DM Serif Display", serif; font-weight: 400; margin: 0; font-size: 30px; }
  #gallery h4 { font-family: "DM Serif Display", serif; font-weight: 400; font-size: 22px; margin: 24px 0 4px; }
  #gallery ol { list-style: none; padding: 0; margin: 0; }
  #gallery li a { display: grid; grid-template-columns: 44px 92px 1fr 18px; gap: 8px; padding: 8px 6px; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; font-size: 14px; }
  #gallery li a:hover { background: var(--pale); }
  #gallery .n { color: var(--deep); font-weight: 700; }
  #gallery .d { color: var(--grey); }
  #gallery .found { color: var(--deep); }
  @media (max-width: 560px) { #gallery li a { grid-template-columns: 38px 1fr 18px; } #gallery .d { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<header id="hud">
  <div class="count">Collected <b id="found">0</b> / <span id="total"></span></div>
  <div class="count"><span id="phase" class="eyebrow"></span> <b id="phaseCount"></b></div>
  <div class="spacer"></div>
  <div class="btns">
    <button id="artBtn" class="ghost" aria-pressed="false">Art pieces</button>
    <button id="levelsBtn" class="ghost" aria-haspopup="true" aria-expanded="false">Levels</button>
    <button id="allBtn" class="ghost">All articles</button>
  </div>
</header>

<div id="levels" class="menu" hidden></div>

<footer id="bar">
  <div id="article"><div class="text"><div class="hint">Collect articles and they'll show up here.</div></div></div>
  <div id="controls">
    <button id="backBtn" aria-label="Move left">◀</button>
    <button id="upBtn" aria-label="Move up" hidden>▲</button>
    <button id="downBtn" aria-label="Move down" hidden>▼</button>
    <button id="jumpBtn">Jump</button>
    <button id="fastBtn" aria-label="Move right">▶</button>
  </div>
  <a id="versionsBtn" href="versions/" target="_blank" rel="noopener" aria-label="Earlier versions of this game" title="Earlier versions">i</a>
</footer>

<div id="title" class="overlay">
  <div class="panel">
    <div class="eyebrow">Post #100 · a little game</div>
    <h1>100 posts</h1>
    <p id="titleSub"></p>
    <button id="startBtn" class="btn">Start</button>
    <div class="keys">← → to move · Space or tap to jump / fly<br>Click any collected article to see it again</div>
  </div>
</div>

<div id="warp" class="overlay" hidden>
  <div class="panel">
    <div class="eyebrow">Warp pipe</div>
    <h1>18 months later…</h1>
    <p>Jun 2023 → Dec 2024</p>
  </div>
</div>

<div id="end" class="panel" hidden>
  <div class="eyebrow">The top step</div>
  <h1>Thank you</h1>
  <p id="endText"></p>
  <div class="row">
    <button id="endAll" class="btn">All articles</button>
    <button id="again" class="ghost">Play again</button>
  </div>
</div>

<div id="gallery" class="overlay" hidden>
  <div class="sheet">
    <div class="top"><h2>All articles</h2><button id="closeGallery" class="ghost">Back to the game</button></div>
    <div id="galleryBody"></div>
  </div>
</div>

<script src="data/posts.js"></script>
<script>
const POSTS = window.POSTS, PHASES = window.PHASES;
const TOTAL = 100;
const G = 480;            // base ground line (world units)
const R = 20;             // player radius
const CAR_FOOT = 26;      // car center to road
const ORANGE = '#F88C00', ORANGE_DK = '#D06E00', LEAF = '#5DA045';
const SKY = { career: '#E8DFF7', quiet: '#E4E7EF', return: '#FCE5EB', framework: '#D5E7F7', build: '#DDF0E6', step: '#CDE3F4' };
const GROUND = { career: '#B9D99F', quiet: '#C9CCD6', return: '#F3C7D2', framework: '#9AA6B4', build: '#D9B98C', step: '#E09A7E' };
const FIREWORK = ['#F7A8B8', '#F5C542', '#A8D8F0', '#B8E0A8', '#C9B8F0', '#F88C00'];
const phaseName = Object.fromEntries(PHASES.map(p => [p.id, p.name]));
const $ = id => document.getElementById(id);

// ---------- world layout ----------
const segs = [], blocks = [];
let wx = 0;
function seg(id, len) { const s = { id, x0: wx, x1: wx + len }; segs.push(s); wx += len; return s; }
const inPhase = id => POSTS.filter(p => p.phase === id);

// 1. career: fly the plane
const car = seg('career', 600 + inPhase('career').length * 260 + 200);
inPhase('career').forEach((p, i) => blocks.push({ x: car.x0 + 600 + i * 260, y: 245 + 125 * Math.sin(i * 1.1), post: p, fly: true }));

// quiet stretch: hangar + warp pipe
const quiet = seg('quiet', 1100);
const hangarX = quiet.x0 + 140, pipeX = quiet.x0 + 900;
inPhase('quiet').forEach((p, i) => blocks.push({ x: quiet.x0 + 660 + i * 120, post: p }));
wx += 400; // unseen gap the warp pipe skips over

// 2. return: parade over little stairs, floats and crates (h = height above ground)
const ret = seg('return', 300 + inPhase('return').length * 230 + 200);
const terrain = [];
{
  let x = ret.x0 + 420, i = 0;
  const put = (w, h, kind) => { terrain.push({ x0: x, x1: x + w, h, kind }); x += w; };
  const mods = [
    () => { put(60, 26, 'step'); put(60, 52, 'step'); put(220, 78, 'step'); put(60, 52, 'step'); put(60, 26, 'step'); },
    () => { put(480, 62, 'float'); },
    () => { put(80, 54, 'crate'); put(80, 108, 'crate'); put(80, 54, 'crate'); },
    () => { put(90, 46, 'step'); put(200, 92, 'step'); x += 140; put(90, 50, 'drum'); },
    () => { put(360, 58, 'float'); x += 90; put(80, 54, 'crate'); },
  ];
  while (x < ret.x1 - 900) { mods[i++ % mods.length](); x += 240 + (i % 3) * 60; }
}
const edgeNear = x => terrain.some(t => Math.abs(x - t.x0) < 34 || Math.abs(x - t.x1) < 34);
const SIGN = [36, 44, 54, 40, 50], MARCH_R = [12, 17, 22, 14, 26, 19], LIFT = [96, 132, 112, 150, 104, 140];
inPhase('return').forEach((p, i) => {
  let x = ret.x0 + 300 + i * 230;
  while (edgeNear(x)) x += 12;
  blocks.push({ x, post: p, marcher: true, s: SIGN[i % 5], mr: MARCH_R[i % 6], lift: LIFT[i % 6] });
});

// 3. framework: drive the truck, articles pile up in the back
const fw = seg('framework', 450 + inPhase('framework').length * 300 + 450);
const driveX0 = fw.x0 + 200, driveX1 = fw.x1 - 200;
const LANE = [42, 112, 168], LANE_OF = [0, 1, 2, 0, 2, 1];
inPhase('framework').forEach((p, i) => blocks.push({ x: fw.x0 + 450 + i * 300, y: G - LANE[LANE_OF[i % 6]], post: p, car: true }));

// 4. build: workshop door leads into a top-down maze
const bld = seg('build', 900);
const doorX = bld.x0 + 320;
const MAZE = [
  '#################',
  'E...#.......#...#',
  '#.#.#.###.#.#.#.#',
  '#.#...#...#...#.#',
  '#.###.#.#####.#.#',
  '#...#...#.....#.#',
  '###.###.#.###.#.#',
  '#.....#...#.#...#',
  '#.###.###.#.#.###',
  '#...#.....#.....X',
  '#################',
];
const MR = MAZE.length, MC = MAZE[0].length;
const cellOf = ch => { for (let r = 0; r < MR; r++) { const c = MAZE[r].indexOf(ch); if (c >= 0) return { c, r }; } };
const ENT = cellOf('E'), EXIT = cellOf('X');
const isWall = (c, r) => {
  if ((c === -1 && r === ENT.r) || (c === MC && r === EXIT.r)) return false;   // doorways out
  return r < 0 || r >= MR || c < 0 || c >= MC || MAZE[r][c] === '#';
};
const dots = new Set();
{
  // spread the pages along the maze by walking distance from the entrance
  const dist = new Map([[ENT.c + ',' + ENT.r, 0]]), q = [ENT], open = [];
  while (q.length) {
    const { c, r } = q.shift(), d = dist.get(c + ',' + r);
    if (d > 1 && MAZE[r][c] === '.') open.push({ c, r });
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr, k = nc + ',' + nr;
      if (nc >= 0 && nc < MC && !isWall(nc, nr) && !dist.has(k)) { dist.set(k, d + 1); q.push({ c: nc, r: nr }); }
    }
  }
  const ps = inPhase('build'), pick = k => Math.floor((k + 0.5) * open.length / ps.length);
  const picked = new Set(ps.map((_, k) => pick(k)));
  ps.forEach((p, k) => blocks.push({ ...open[pick(k)], post: p, maze: true }));
  open.forEach((cell, k) => { if (!picked.has(k)) dots.add(cell.c + ',' + cell.r); });
}

// 5. a new step: a race through town to the #100 finish line
const stepPosts = inPhase('step');
const nLocked = Math.max(0, TOTAL - 1 - POSTS.length);
const nStops = stepPosts.length + nLocked, STOP_W = 280;
const stp = seg('step', 400 + nStops * STOP_W + 1100);
const homeX = stp.x0 + 400 + nStops * STOP_W + 250;     // the #100 finish line
const flagX = homeX;
for (let k = 0; k < nStops; k++) {
  const x = stp.x0 + 400 + k * STOP_W, b = { x, lift: LIFT[k % 6] };
  if (k < stepPosts.length) b.post = stepPosts[k]; else b.locked = POSTS.length + 1 + (k - stepPosts.length);
  blocks.push(b);
  // hurdles between the boxes (h = height above ground)
  terrain.push({ x0: x + 128, x1: x + 152, h: [44, 54][k % 2], kind: 'hurdle' });
  if (k % 3 === 2) terrain.push({ x0: x + 208, x1: x + 232, h: 44, kind: 'hurdle' });
}
// small and far away: a house for each earlier level, and the crowd behind the rail
const HOUSES = ['career', 'quiet', 'return', 'framework', 'build'].map((ph, i) => ({ ph, x: stp.x0 + 300 + i * (homeX - stp.x0 - 600) / 5 }));
const CROWD = Array.from({ length: Math.floor((homeX - stp.x0 + 400) / 46) }, (_, i) => ({ x: stp.x0 + 30 + i * 46 + (i * 17 % 20), r: [7, 9, 6, 10, 8][i % 5], ph: i * 1.3 }));
const worldEnd = stp.x1;

function groundY(x) {
  if ((x >= ret.x0 && x < ret.x1) || x >= stp.x0) for (const t of terrain) if (x >= t.x0 && x < t.x1) return G - t.h;
  return G;
}
for (const b of blocks) { b.s = b.s || 44; if (b.y == null && !b.maze) b.y = groundY(b.x) - (b.lift || 126) - b.s / 2; }
function phaseAt(x) {
  for (const s of segs) if (x < s.x1) return x < s.x0 ? 'quiet' : s.id;
  return 'step';
}
const modeAt = x => x < quiet.x0 ? 'fly' : x >= driveX0 && x <= driveX1 ? 'drive' : 'run';
const footOf = m => m === 'drive' ? CAR_FOOT : R;

// ---------- state ----------
const cv = $('c'), ctx = cv.getContext('2d');
let dpr, S, W, H, camX = 0, camY = 0;
let state = 'title', T = 0, found = 0, showArt = false, endT = 0, lastAxis = 'h';
const P = { x: 200, y: 250, vy: 0, onGround: false, dir: 1, history: [], trail: [] };
const M = { x: 0, y: 0, dir: 1, stack: [] };      // player inside the maze (cell units)
const keys = { left: false, right: false, up: false, down: false };
const banner = [], carPile = [], followers = [], popups = [], sparks = [];

function resize() {
  dpr = window.devicePixelRatio || 1;
  const h = innerHeight - $('bar').offsetHeight;   // the game stops above the article bar
  cv.width = innerWidth * dpr; cv.height = h * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = h + 'px';
  S = Math.min(h / 560, innerWidth / 640);
  W = innerWidth / S; H = h / S;
}
addEventListener('resize', resize); resize();

// ---------- input ----------
function jump() {
  if (state !== 'play') return;
  const m = modeAt(P.x);
  if (m === 'fly') P.vy = -430;
  else if (P.onGround) { P.vy = m === 'drive' ? -720 : -800; P.onGround = false; }
}
const KEYMAP = { ArrowRight: 'right', KeyD: 'right', ArrowLeft: 'left', KeyA: 'left', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; lastAxis = k === 'up' || k === 'down' ? 'v' : 'h'; }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if ((e.code === 'Space' || k === 'up') && !e.repeat && state === 'play') jump();
  if (e.code === 'Enter' && state === 'title') start();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
function hold(btn, key) {
  btn.addEventListener('pointerdown', e => { e.preventDefault(); keys[key] = true; lastAxis = key === 'up' || key === 'down' ? 'v' : 'h'; });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, () => keys[key] = false);
}
hold($('backBtn'), 'left'); hold($('fastBtn'), 'right'); hold($('upBtn'), 'up'); hold($('downBtn'), 'down');
$('jumpBtn').addEventListener('pointerdown', e => { e.preventDefault(); jump(); });

cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const x = e.clientX / S + camX, y = e.clientY / S + camY;
  for (const b of blocks) {
    if (b.hit && b.post && !b.maze && !b.inCar && Math.abs(x - b.x) < b.s / 2 + 10 && Math.abs(y - b.y) < b.s / 2 + 10) return showPost(b.post);
  }
  jump();
});

// ---------- UI ----------
$('total').textContent = POSTS.length;
$('titleSub').textContent = `${POSTS.length} posts since Dec 2022, in ${PHASES.length} phases. Collect them all.`;
function start() { $('title').hidden = true; state = 'play'; }

// ---------- level menu: jump to any level from anywhere ----------
const LEVELS = [
  { id: 'career', ic: '✈️', hash: 'plane', x: () => 200 },
  { id: 'quiet', ic: '💤', hash: 'hangar', x: () => quiet.x0 + 60 },
  { id: 'return', ic: '🎉', hash: 'parade', x: () => ret.x0 + 60 },
  { id: 'framework', ic: '🚚', hash: 'truck', x: () => fw.x0 + 60 },
  { id: 'build', ic: '🔧', hash: 'workshop', x: () => doorX - 140 },
  { id: 'step', ic: '🏁', hash: 'race', x: () => stp.x0 + 60 },
];
let warpTimer;
function goToLevel(id) {
  const lv = LEVELS.find(l => l.id === id); if (!lv) return;
  clearTimeout(warpTimer);
  for (const k of ['title', 'warp', 'end', 'gallery']) $(k).hidden = true;
  $('controls').hidden = false; setMazeControls(false);
  state = 'play';
  P.x = lv.x(); P.vy = 0; P.trail.length = 0; P.history.length = 0;
  P.y = modeAt(P.x) === 'fly' ? 250 : groundY(P.x) - footOf(modeAt(P.x));
  P.onGround = modeAt(P.x) !== 'fly';
  camX = P.x - W * 0.3;
  setHud(id);
  history.replaceState(null, '', '#' + lv.hash);
}
function renderLevels() {
  const here = state === 'maze' ? 'build' : phaseAt(P.x);
  $('levels').innerHTML = LEVELS.map(l => {
    const all = blocks.filter(b => b.post && b.post.phase === l.id);
    return `<button data-id="${l.id}" class="${l.id === here ? 'here' : ''}"><span class="ic">${l.ic}</span><span class="nm">${esc(phaseName[l.id])}</span><span class="ct">${all.filter(b => b.hit).length} / ${all.length}</span></button>`;
  }).join('');
}
function toggleLevels(open) {
  if (open) renderLevels();
  $('levels').hidden = !open; $('levelsBtn').setAttribute('aria-expanded', open);
}
$('levelsBtn').onclick = e => { e.stopPropagation(); toggleLevels($('levels').hidden); };
$('levels').onclick = e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  toggleLevels(false); document.activeElement.blur(); goToLevel(b.dataset.id);
};
addEventListener('click', e => { if (!$('levels').hidden && !e.target.closest('#levels')) toggleLevels(false); });
addEventListener('keydown', e => { if (e.code === 'Escape') toggleLevels(false); });
$('startBtn').onclick = start;
$('artBtn').onclick = () => { showArt = !showArt; $('artBtn').setAttribute('aria-pressed', showArt); };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
function showPost(p) {
  $('article').innerHTML = `<div class="text"><div class="eyebrow">#${p.n} · ${esc(phaseName[p.phase])} · ${fmtDate(p.date)}${p.paid ? ' · Paid' : ''}</div>
    <div class="title" title="${esc(p.title)}">${esc(p.title)}</div></div>
    <a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Read →</a>`;
}
const showLocked = n => $('article').innerHTML = `<div class="text"><div class="eyebrow">#${n}</div><div class="title">Not written yet</div></div>`;

function openGallery() {
  $('galleryBody').innerHTML = PHASES.map(ph => {
    const ps = inPhase(ph.id);
    return `<h4>${esc(ph.name)}</h4><div class="eyebrow">${ps.length} post${ps.length === 1 ? '' : 's'}</div><ol>` +
      ps.map(p => `<li><a href="${esc(p.url)}" target="_blank" rel="noopener"><span class="n">#${p.n}</span><span class="d">${fmtDate(p.date)}</span><span>${esc(p.title)}</span><span class="found">${blocks.find(b => b.post === p)?.hit ? '✓' : ''}</span></a></li>`).join('') + '</ol>';
  }).join('');
  $('gallery').hidden = false;
}
$('allBtn').onclick = openGallery; $('endAll').onclick = openGallery;
$('closeGallery').onclick = () => $('gallery').hidden = true;
$('again').onclick = () => location.reload();

function setHud(ph) {
  const all = blocks.filter(b => b.post && b.post.phase === ph);
  $('phase').textContent = phaseName[ph];
  $('phaseCount').textContent = `${all.filter(b => b.hit).length} / ${all.length}`;
}
function setMazeControls(on) {
  $('upBtn').hidden = $('downBtn').hidden = !on;
  $('jumpBtn').hidden = on;
}

// ---------- update ----------
function hitBlock(b) {
  if (b.locked) { b.t = T; return showLocked(b.locked); }
  if (!b.hit) {
    b.hit = true; b.t = T; found++; $('found').textContent = found;
    if (!b.maze) popups.push({ x: b.x, y: b.y, n: b.post.n, t: T });
    if (b.fly) banner.push(b.post.n);
    if (b.car) { b.inCar = true; carPile.push(b.post.n); }
    if (b.maze) M.stack.push(b.post.n);
    if (b.marcher) { b.follow = true; b.fx = b.x; b.fy = groundY(b.x); followers.push(b); }
  }
  showPost(b.post);
}

function enterMaze(side) {
  state = 'maze'; setMazeControls(true);
  const cell = side === 'left' ? ENT : EXIT;
  M.x = cell.c; M.y = cell.r; M.dir = side === 'left' ? 1 : -1;
}
function exitMaze(side) {
  state = 'play'; setMazeControls(false);
  P.x = side === 'left' ? doorX - 90 : doorX + 150; P.y = G - R; P.vy = 0; P.dir = side === 'left' ? -1 : 1;
}

// pac-man style: slide back to the corridor center, then move until a wall
function mazeStep(ax, d, dist) {
  const [a, b] = ax === 'h' ? ['x', 'y'] : ['y', 'x'];
  const cellA = Math.round(M[a]), cellB = Math.round(M[b]);
  const wallAt = ia => ax === 'h' ? isWall(ia, cellB) : isWall(cellB, ia);
  if (wallAt(cellA + d) && (M[a] - cellA) * d >= -1e-6) return false;
  const err = cellB - M[b];
  if (Math.abs(err) > 1e-3) { M[b] += Math.sign(err) * Math.min(dist, Math.abs(err)); return true; }
  let na = M[a] + d * dist;
  if (wallAt(cellA + d) && (na - cellA) * d > 0) na = cellA;
  M[a] = na;
  if (ax === 'h') M.dir = d;
  return true;
}
function updateMaze(dt) {
  const h = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), v = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  const order = lastAxis === 'v' ? [['v', v], ['h', h]] : [['h', h], ['v', v]];
  for (const [ax, d] of order) if (d && mazeStep(ax, d, 4.5 * dt)) break;
  const c = Math.round(M.x), r = Math.round(M.y);
  dots.delete(c + ',' + r);
  for (const b of blocks) if (b.maze && !b.hit && b.c === c && b.r === r) hitBlock(b);
  if (M.x < -0.3) exitMaze('left');
  else if (M.x > MC - 0.7) exitMaze('right');
  setHud('build');
}

function updateFollowers(dt) {
  const inParade = P.x >= ret.x0 && P.x < ret.x1;
  followers.forEach((b, i) => {
    let tx, ty;
    b.hop = 0;
    if (inParade) {
      const t = P.trail[(i + 1) * 14];
      tx = t ? t.x : P.x - 42 * (i + 1) * P.dir; ty = t ? t.y : groundY(tx);
    } else {           // wait in a line at whichever end of the parade you left from
      tx = P.x >= ret.x1 ? ret.x1 - 60 - i * 30 : ret.x0 + 60 + i * 30; ty = groundY(tx);
    }
    const k = Math.min(1, dt * 10);
    b.moving = Math.abs(tx - b.fx) > 1;
    b.fx += (tx - b.fx) * k; b.fy += (ty - b.fy) * k;
    b.x = b.fx; b.y = b.fy - b.mr * 2.2 - 46 - b.s / 2;
  });
}

function update(dt) {
  if (state === 'maze') return updateMaze(dt);
  if (state !== 'play') return;
  const dir = keys.left === keys.right ? 0 : keys.left ? -1 : 1;
  if (dir) P.dir = dir;
  const prevX = P.x, prevMode = modeAt(P.x);
  let nx = Math.min(flagX + 300, Math.max(160, P.x + dir * (prevMode === 'drive' ? 380 : 300) * dt));
  if (prevMode !== 'fly' && groundY(nx + dir * R * 0.6) < P.y + footOf(prevMode) - 2) nx = P.x;   // anything higher: jump up
  P.x = nx;

  // workshop door → maze
  if (prevX < doorX && P.x >= doorX) return enterMaze('left');
  if (prevX > doorX + 60 && P.x <= doorX + 60) return enterMaze('right');

  // warp pipe: skip the unseen gap in either direction
  if (P.x > pipeX && P.x < ret.x0) {
    if (dir >= 0) {
      state = 'warp'; $('warp').hidden = false;
      warpTimer = setTimeout(() => { $('warp').hidden = true; P.x = ret.x0 + 60; P.y = G - 260; P.vy = 0; P.trail.length = 0; state = 'play'; }, 1600);
      return;
    }
    P.x = pipeX - 60;
  }

  const m = modeAt(P.x), foot = footOf(m);
  if (m !== prevMode && m !== 'fly' && P.onGround) P.y = groundY(P.x) - foot;
  if (m === 'fly') {
    P.vy = Math.min(P.vy + 1100 * dt, 520);
    P.y += P.vy * dt;
    if (P.y < 70) { P.y = 70; P.vy = 0; }
    if (P.y > G - 50) { P.y = G - 50; P.vy = 0; }
    P.onGround = false;
    for (const b of blocks) if (b.fly && !b.hit && Math.hypot(P.x - b.x, P.y - b.y) < 58) hitBlock(b);
    P.history.unshift({ x: P.x, y: P.y }); P.history.length = Math.min(P.history.length, 400);
  } else {
    P.vy += 2200 * dt; P.y += P.vy * dt;
    const gy = groundY(P.x);
    if (P.vy >= 0 && P.y + foot >= gy) { P.y = gy - foot; P.vy = 0; P.onGround = true; }
    else if (P.y + foot < gy - 1) P.onGround = false;
    if (m === 'drive') {
      for (const b of blocks) if (b.car && !b.hit && Math.abs(P.x - b.x) < 55 + b.s / 2 && b.y + b.s / 2 > P.y - 34 && b.y - b.s / 2 < P.y + CAR_FOOT) hitBlock(b);
    } else {
      // touching a box from any side collects it
      for (const b of blocks) {
        if (b.fly || b.car || b.maze || b.follow || (b.hit && !b.locked)) continue;
        if (b.locked && T - (b.t ?? -9) < 1.5) continue;
        if (Math.abs(P.x - b.x) < b.s / 2 + R * 0.8 && Math.abs(P.y - b.y) < b.s / 2 + R * 0.8) hitBlock(b);
      }
    }
    const last = P.trail[0];
    if (!last || Math.abs(last.x - P.x) + Math.abs(last.y - (P.y + R)) > 3) { P.trail.unshift({ x: P.x, y: P.y + R }); P.trail.length = Math.min(P.trail.length, 1000); }
  }
  updateFollowers(dt);
  setHud(phaseAt(P.x));

  if (P.x >= flagX - 10) {
    state = 'end'; endT = T;
    $('controls').hidden = true;
    $('endText').textContent = `You collected ${found} of ${POSTS.length} posts. Post #100 is the next step.`;
    setTimeout(() => $('end').hidden = false, 900);
  }
}

let artSeen;
let artMute = false;
function art(name, x, y, w, h) {

}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawOrange(x, y, r, o = {}) {
  ctx.save(); ctx.translate(x, y + (o.bob || 0));

  ctx.strokeStyle = '#6B4A2B'; ctx.lineWidth = r * 0.08; ctx.beginPath(); ctx.moveTo(0, -r * 0.9); ctx.lineTo(0.05 * r, -r * 1.12); ctx.stroke();

  } else {
    for (const ex of [-0.3, 0.3]) { ctx.beginPath(); ctx.arc(ex * r + f, -r * 0.1, r * 0.09, 0, Math.PI * 2); ctx.fill(); }
    ctx.beginPath(); ctx.arc(f, r * 0.15, r * 0.22, 0.2, Math.PI - 0.2); ctx.stroke();
  }

    ctx.beginPath(); ctx.moveTo(back * r * 0.9, -r * 0.45); ctx.lineTo(back * r * 1.45, -r * 0.2 - flap); ctx.lineTo(back * r * 1.3, -r * 0.05 - flap); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawPlane(x, y, withPilot, tilt = 0) {

function card(x, y, w, h, n, color, rot = 0) {

// articles tied behind the plane; pts are where each card hangs
function drawBanner(tailX, tailY, pts) {

function drawBlock(b) {

  if (b.locked) {

    ctx.fillStyle = '#8A9BB0'; ctx.font = '600 12px DM Sans'; ctx.textAlign = 'center';
    ctx.fillText('#' + b.locked, b.x, b.y + 4 + lift); art('coming-soon block', x, y, z, z); return;

    ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(z * 0.6)}px DM Sans`; ctx.textAlign = 'center'; ctx.fillText('?', b.x, b.y + z * 0.22 + Math.sin(T * 3 + b.x) * 1.5);

    ctx.fillStyle = '#1F6FA8'; ctx.font = `700 ${Math.round(z * 0.32)}px DM Sans`; ctx.textAlign = 'center'; ctx.fillText('#' + b.post.n, b.x, b.y + z * 0.12 + lift);

}

    const w = t.x1 - t.x0, top = G - t.h;
    if (t.kind === 'step') {
      ctx.fillStyle = '#F7B6C5'; ctx.fillRect(t.x0, top, w, t.h); ctx.strokeStyle = '#C97F93'; ctx.lineWidth = 2; ctx.strokeRect(t.x0, top, w, t.h);
      art('parade steps', t.x0, top, w, t.h);
    } else if (t.kind === 'crate') {
      for (let y = top; y < G - 1; y += 54) {
        ctx.fillStyle = '#D9A866'; ctx.fillRect(t.x0 + 2, y, w - 4, 54); ctx.strokeStyle = '#9A6A32'; ctx.lineWidth = 3; ctx.strokeRect(t.x0 + 2, y, w - 4, 54);
        ctx.beginPath(); ctx.moveTo(t.x0 + 4, y + 2); ctx.lineTo(t.x1 - 4, y + 52); ctx.stroke();
      }
      art('crate', t.x0, top, w, t.h);
    } else if (t.kind === 'drum') {
      ctx.fillStyle = '#E0524C'; ctx.fillRect(t.x0, top + 6, w, t.h - 6); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(t.x0 + w / 2, top + 6, w / 2, 8, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#F5C542'; ctx.lineWidth = 2; ctx.beginPath();
      for (let k = 0; k <= 4; k++) ctx.lineTo(t.x0 + k * w / 4, top + (k % 2 ? t.h - 6 : 14));
      ctx.stroke(); art('big drum', t.x0, top, w, t.h);
    } else if (t.kind === 'hurdle') {
      const cx = (t.x0 + t.x1) / 2, bw = 48;
      ctx.fillStyle = 'rgba(60,30,20,.25)'; ctx.beginPath(); ctx.ellipse(cx, G + 3, 30, 5, 0, 0, 7); ctx.fill();   // shadow
      ctx.fillStyle = '#3D4655';
      for (const lx of [cx - bw / 2 + 4, cx + bw / 2 - 10]) { ctx.fillRect(lx, top + 6, 6, t.h - 6); ctx.fillRect(lx - 5, G - 5, 16, 5); }
      rr(cx - bw / 2, top, bw, 16, 4); ctx.save(); ctx.clip();
      for (let k = 0; k < 6; k++) { ctx.fillStyle = k % 2 ? '#fff' : '#E0524C'; ctx.fillRect(cx - bw / 2 + k * 8, top, 8, 16); }
      ctx.restore(); ctx.strokeStyle = '#7A1F1B'; ctx.lineWidth = 2.5; rr(cx - bw / 2, top, bw, 16, 4); ctx.stroke();
      art('hurdle', cx - bw / 2 - 4, top - 4, bw + 8, t.h + 8);
    } else if (t.kind === 'bench') {
      ctx.fillStyle = '#8A6A45'; ctx.fillRect(t.x0, top, w, 8); ctx.fillRect(t.x0 + 6, top - 22, w - 12, 6);
      ctx.fillRect(t.x0 + 8, top, 6, t.h); ctx.fillRect(t.x1 - 14, top, 6, t.h);
      art('bench', t.x0, top - 22, w, t.h + 22);
    } else if (t.kind === 'planter') {
      ctx.fillStyle = '#C97F5B'; ctx.fillRect(t.x0, top, w, t.h);
      ctx.fillStyle = '#6BBF73'; for (const dx of [12, 30, 48]) { ctx.beginPath(); ctx.arc(t.x0 + dx, top - 4, 11, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#F7A8B8'; ctx.beginPath(); ctx.arc(t.x0 + 30, top - 12, 5, 0, 7); ctx.fill();
      art('planter', t.x0, top - 16, w, t.h + 16);
    } else if (t.kind === 'float') {
      ctx.fillStyle = '#A8D8F0'; rr(t.x0, top, w, t.h - 12, 10); ctx.fill();
      ctx.fillStyle = '#fff';
      for (let x = t.x0 + 16; x < t.x1 - 8; x += 32) { ctx.beginPath(); ctx.arc(x, top + 4, 12, 0, Math.PI); ctx.fill(); }
      ctx.fillStyle = '#5C667A';
      for (const x of [t.x0 + 40, t.x1 - 40]) { ctx.beginPath(); ctx.arc(x, G - 12, 12, 0, 7); ctx.fill(); }
      for (const [dx, c] of [[20, '#F7A8B8'], [w - 24, '#C9B8F0']]) {
        const bx = t.x0 + dx, by = top - 80 + Math.sin(T * 2 + dx) * 4;
        ctx.strokeStyle = '#8A6A45'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx, top); ctx.lineTo(bx, by + 16); ctx.stroke();
        ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(bx, by, 12, 16, 0, 0, 7); ctx.fill();
      }
      art('parade float + balloons', t.x0, top - 100, w, t.h + 100);
    }
  }
}

function drawFramework() {
  if (camX > fw.x1 || camX + W < fw.x0) return;
  ctx.strokeStyle = 'rgba(31,111,168,.12)'; ctx.lineWidth = 1;
  const x0 = Math.max(fw.x0, camX), x1 = Math.min(fw.x1, camX + W);
  ctx.beginPath();
  for (let x = Math.ceil(x0 / 40) * 40; x < x1; x += 40) { ctx.moveTo(x, camY); ctx.lineTo(x, G); }
  for (let y = Math.ceil(camY / 40) * 40; y < G; y += 40) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
  art('blueprint sky', x0 + 20, camY + 90, 160, 60);
}
function drawRoad() {
  if (camX > fw.x1 || camX + W < fw.x0) return;
  const x0 = Math.max(fw.x0, camX), x1 = Math.min(fw.x1, camX + W);
  ctx.fillStyle = '#F2F8FD';
  for (let x = Math.ceil(x0 / 60) * 60; x < x1; x += 60) ctx.fillRect(x, G + 22, 30, 5);
  art('road', x0 + 10, G, 160, 40);
}

function drawBuild() {
  if (camX > bld.x1 || camX + W < bld.x0) return;
  // workshop building with a door into the maze
  const x = doorX - 200;
  ctx.fillStyle = '#9CCBB0'; ctx.strokeStyle = '#5E8F74'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, G); ctx.lineTo(x, G - 180); ctx.lineTo(x + 200, G - 260); ctx.lineTo(x + 400, G - 180); ctx.lineTo(x + 400, G); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5E4A3A'; rr(doorX - 36, G - 110, 92, 110, [10, 10, 0, 0]); ctx.fill();
  ctx.fillStyle = '#fff'; rr(x + 120, G - 170, 160, 34, 6); ctx.fill();
  ctx.fillStyle = '#1A1A1A'; ctx.font = '600 14px DM Sans'; ctx.textAlign = 'center'; ctx.fillText('The workshop', x + 200, G - 148);
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = '700 22px DM Sans'; ctx.fillText('→', doorX + 10, G - 50);
  art('workshop + door', x, G - 260, 400, 260);
}

function drawMaze() {
  ctx.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
  ctx.fillStyle = SKY.build; ctx.fillRect(0, 0, W, H);
  const cs = Math.min((W - 32) / MC, (H - 150) / MR), ox = (W - cs * MC) / 2, oy = 80 + (H - 100 - cs * MR) / 2;
  const cx = c => ox + (c + 0.5) * cs, cy = r => oy + (r + 0.5) * cs;
  ctx.fillStyle = '#1A1A1A'; ctx.font = '400 26px DM Serif Display'; ctx.textAlign = 'center';
  ctx.fillText('The workshop', W / 2, oy - 18);
  for (let r = 0; r < MR; r++) for (let c = 0; c < MC; c++) if (MAZE[r][c] === '#') {
    ctx.fillStyle = '#86BFA0'; rr(ox + c * cs + 1, oy + r * cs + 1, cs - 2, cs - 2, cs * 0.18); ctx.fill();
  }
  art('maze walls', ox, oy, cs * 5, cs);
  ctx.fillStyle = '#E0B73A';
  for (const k of dots) { const [c, r] = k.split(',').map(Number); ctx.beginPath(); ctx.arc(cx(c), cy(r), cs * 0.07, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#5E8F74'; ctx.font = `700 ${cs * 0.45}px DM Sans`;
  ctx.fillText('←', cx(ENT.c) - cs * 0.1, cy(ENT.r) + cs * 0.16); ctx.fillText('→', cx(EXIT.c) + cs * 0.1, cy(EXIT.r) + cs * 0.16);
  for (const b of blocks) if (b.maze && !b.hit) {
    const w = cs * 0.5, h = cs * 0.62, bob = Math.sin(T * 3 + b.c) * cs * 0.04;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 1; rr(cx(b.c) - w / 2, cy(b.r) - h / 2 + bob, w, h, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#C8DEF0'; for (let l = 0; l < 3; l++) ctx.fillRect(cx(b.c) - w * 0.32, cy(b.r) - h * 0.3 + l * h * 0.14 + bob, w * 0.64, 2);
    ctx.fillStyle = '#1F6FA8'; ctx.font = `700 ${Math.round(cs * 0.17)}px DM Sans`; ctx.fillText('#' + b.post.n, cx(b.c), cy(b.r) + h * 0.36 + bob);
    art('page', cx(b.c) - w / 2, cy(b.r) - h / 2, w, h);
  }
  const px = ox + (M.x + 0.5) * cs, py = oy + (M.y + 0.5) * cs, pr = cs * 0.3;
  drawOrange(px, py, pr, { dir: M.dir });
  drawPageStack(px, py - pr * 1.25, M.stack.length, cs * 0.46);
  art('orange - carrying page stack (top-down)', px - pr, py - pr * 1.3 - M.stack.length * cs * 0.08, pr * 2, pr * 2.3 + M.stack.length * cs * 0.08);
  drawArtLabels();
}

function drawRobot(x, feet) {
  ctx.fillStyle = '#C9CCD6'; ctx.strokeStyle = '#6E7A8E'; ctx.lineWidth = 2;
  rr(x - 12, feet - 30, 24, 22, 4); ctx.fill(); ctx.stroke();
  rr(x - 14, feet - 52, 28, 20, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1F6FA8'; ctx.beginPath(); ctx.arc(x - 6, feet - 42, 3, 0, 7); ctx.arc(x + 6, feet - 42, 3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x, feet - 52); ctx.lineTo(x, feet - 62); ctx.stroke();
  ctx.fillStyle = '#E0524C'; ctx.beginPath(); ctx.arc(x, feet - 64, 3, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6E7A8E'; ctx.beginPath(); ctx.moveTo(x - 6, feet - 8); ctx.lineTo(x - 6, feet); ctx.moveTo(x + 6, feet - 8); ctx.lineTo(x + 6, feet); ctx.stroke();
}

function drawHouse(h) {      // drawn at its own origin; the caller shrinks it
  const w = 230, ht = 150;
  ctx.fillStyle = SKY[h.ph]; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2;
  ctx.fillRect(-w / 2, -ht, w, ht); ctx.strokeRect(-w / 2, -ht, w, ht);
  ctx.fillStyle = GROUND[h.ph]; ctx.beginPath(); ctx.moveTo(-w / 2 - 14, -ht); ctx.lineTo(0, -ht - 70); ctx.lineTo(w / 2 + 14, -ht); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; for (const dx of [-70, 50]) { ctx.fillRect(dx, -ht + 30, 30, 30); ctx.strokeRect(dx, -ht + 30, 30, 30); }
  ctx.fillStyle = '#8A6A45'; ctx.fillRect(-18, -64, 36, 64);
  // each house keeps a piece of its level
  if (h.ph === 'career') drawPlane(70, -ht - 30, false, -0.1);
  if (h.ph === 'quiet') drawOrange(70, -14, 13, { sleep: true });
  if (h.ph === 'return') drawBunting(-w / 2, w / 2, -ht + 6);
  if (h.ph === 'framework') { ctx.fillStyle = '#C8DEF0'; ctx.fillRect(36, -60, 70, 60); ctx.strokeRect(36, -60, 70, 60); }
  if (h.ph === 'build') drawRobot(72, 0);
}

const FAR = G - 110;           // where the far-away town sits
function shrunk(x, y, k, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(k, k); artMute = true; fn(); artMute = false; ctx.restore(); }

// back layer: tiny town, far road with the truck, the plane overhead, the crowd behind the rail
function drawRaceBack() {
  if (camX + W < stp.x0 - 100) return;
  const x0 = Math.max(stp.x0, camX - 10), x1 = camX + W + 10;
  ctx.globalAlpha = 0.75;
  for (const h of HOUSES) if (Math.abs(h.x - camX - W / 2) < W) { shrunk(h.x, FAR, 0.42, () => drawHouse(h)); art('tiny house for each level', h.x - 50, FAR - 92, 100, 92); }
  // far road with the truck
  ctx.fillStyle = '#C9CCD6'; ctx.fillRect(x0, FAR, x1 - x0, 12);
  const tx = camX - 100 + ((T * 70) % (W + 200));
  shrunk(tx, FAR + 10, 0.4, () => drawCar(0, 0, true, carPile));
  art('tiny truck on far road', tx - 26, FAR - 16, 52, 26);
  // plane with the banner, high overhead
  const px = camX + ((T * 90) % (W + 700)) - 150, py = camY + 70 + Math.sin(T * 1.5) * 8;
  shrunk(px, py, 0.55, () => {
    drawBanner(-48, 2, banner.map((n, i) => ({ n, x: -60 - (i + 1) * 30, y: Math.sin(T * 4 + i) * 3 })));
    drawPlane(0, 0, true, Math.sin(T * 1.5) * -0.06);
  });
  art('tiny plane + banner', px - 34, py - 22, 66, 34);
  ctx.globalAlpha = 1;
  // grass infield, crowd and the rail
  ctx.fillStyle = '#C6E2B0'; ctx.fillRect(x0, FAR + 12, x1 - x0, G - FAR - 12);
  for (const p of CROWD) {
    if (p.x < x0 - 20 || p.x > x1 + 20) continue;
    const hop = Math.abs(Math.sin(T * 4.5 + p.ph)) * 8;
    drawOrange(p.x, G - 40 - p.r * 1.15 - hop, p.r, { feet: true, still: true, dir: p.x > P.x ? -1 : 1 });
  }
  art('crowd cheering (small)', camX + W * 0.5, G - 70, 120, 34);
  ctx.fillStyle = 'rgba(205,227,244,.35)'; ctx.fillRect(x0, camY - 10, x1 - x0, G - 40 - camY + 10);   // haze pushes it all back
  ctx.fillStyle = '#fff';
  ctx.fillRect(x0, G - 40, x1 - x0, 4);
  for (let x = Math.ceil(x0 / 50) * 50; x < x1; x += 50) ctx.fillRect(x, G - 40, 3, 22);
  art('rail', x0 + 10, G - 44, 120, 26);
  // maze orange with her stack of pages, cheering by the rail
  const bh = HOUSES.find(h => h.ph === 'build'), mh = Math.abs(Math.sin(T * 4 + 1)) * 10;
  if (M.stack.length && Math.abs(bh.x - camX - W / 2) < W) {
    drawOrange(bh.x, G - 40 - 12 - mh, 11, { feet: true, still: true });
    drawPageStack(bh.x, G - 40 - 26 - mh, M.stack.length, 16);
  }
  // finish line
  const fx = homeX;
  ctx.fillStyle = '#6E7A8E'; ctx.fillRect(fx - 90, G - 200, 8, 200); ctx.fillRect(fx + 82, G - 200, 8, 200);
  ctx.fillStyle = '#1F6FA8'; rr(fx - 100, G - 230, 200, 46, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 22px DM Sans'; ctx.textAlign = 'center'; ctx.fillText('#100 · FINISH', fx, G - 199);
  for (let k = 0; k < 20; k++) { ctx.fillStyle = k % 2 ? '#1A1A1A' : '#fff'; ctx.fillRect(fx - 4, G - 4 - k * 6 - 60, 8, 6); }
  art('finish line (#100)', fx - 100, G - 230, 200, 230);
}
function drawTrackLines() {
  if (camX + W < stp.x0) return;
  const x0 = Math.max(stp.x0, camX - 10), x1 = camX + W + 10;
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(x0, G + 18, x1 - x0, 3); ctx.fillRect(x0, G + 48, x1 - x0, 3);
  ctx.fillStyle = '#fff'; ctx.fillRect(homeX - 4, G, 8, 60);
  art('running track', x0 + 10, G, 160, 60);
}

// ---------- finale: a bit of every level on the top step ----------
const partyX = () => homeX + 60;
function drawFinale(dt) {
  const top = groundY(flagX), cxm = partyX(), a = T - endT;
  drawBunting(cxm - 420, cxm + 420, camY + H * 0.3);
  // everyone jumping at the finish: the parade oranges, the maze orange with her stack, and the runner
  const gap = Math.min(34, 520 / Math.max(1, followers.length));
  followers.forEach((b, i) => {
    const x = cxm - (followers.length - 1) * gap / 2 + i * gap, hop = Math.abs(Math.sin(a * 5 + i * 0.7)) * 22;
    drawOrange(x, top - b.mr * 1.15 - hop, b.mr, { feet: true, still: true });
  });
  const mh = Math.abs(Math.sin(a * 4 + 1)) * 26;
  drawOrange(cxm - 330, top - 20 - mh, 20, { dir: 1, feet: true, still: true });
  drawPageStack(cxm - 330, top - 46 - mh, M.stack.length, 30);
  if (M.stack.length) art('orange - holding page stack', cxm - 350, top - 60 - M.stack.length * 5.4 - mh, 40, 60 + M.stack.length * 5.4);
  const ph = Math.abs(Math.sin(a * 4.4)) * 34;
  drawOrange(cxm + 330, top - R - ph, R, { dir: -1, feet: true, still: true, bandana: true });
  art('all the oranges jumping (finale)', cxm - 300, top - 150, 600, 150);
  // fireworks
  if (Math.random() < dt * 2.2) {
    const fx = camX + W * (0.15 + Math.random() * 0.7), fy = camY + H * (0.12 + Math.random() * 0.3), col = FIREWORK[Math.random() * FIREWORK.length | 0];
    for (let k = 0; k < 36; k++) { const ang = k / 36 * Math.PI * 2, sp = 80 + Math.random() * 90; sparks.push({ x: fx, y: fy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, t: T, col }); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i], age = T - s.t;
    if (age > 1.3) { sparks.splice(i, 1); continue; }
    s.vy += 90 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    ctx.globalAlpha = 1 - age / 1.3; ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(s.x, s.y, 2.6, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  art('fireworks', camX + W * 0.4, camY + H * 0.12, 120, 80);
}

function drawArtLabels() {
  if (!showArt) return;
  ctx.setLineDash([6, 4]); ctx.lineWidth = 2; ctx.font = '600 12px DM Sans'; ctx.textAlign = 'left';
  for (const [name, r] of artSeen) {
    ctx.strokeStyle = '#E0524C'; ctx.strokeRect(r.x, r.y, r.w, r.h);
    const tw = ctx.measureText(name).width + 10;
    ctx.fillStyle = '#E0524C'; ctx.fillRect(r.x, r.y - 18, tw, 18); ctx.fillStyle = '#fff'; ctx.fillText(name, r.x + 5, r.y - 5);
  }
  ctx.setLineDash([]);
}

function draw(dt) {
  artSeen = new Map();
  if (state === 'maze') return drawMaze();
  ctx.setTransform(dpr * S, 0, 0, dpr * S, -camX * dpr * S, -camY * dpr * S);
  for (const s of segs) {
    const x0 = Math.max(s.x0, camX - 10), x1 = Math.min(s.id === 'quiet' ? ret.x0 : s.x1, camX + W + 10);
    if (x1 > x0) { ctx.fillStyle = SKY[s.id]; ctx.fillRect(x0, camY - 10, x1 - x0 + 1, H + 20); }
  }
  if (camX + W > worldEnd) { ctx.fillStyle = SKY.step; ctx.fillRect(worldEnd, camY - 10, camX + W - worldEnd + 10, H + 20); }
  drawClouds(); art('clouds', camX + W * 0.55, 40, 120, 50);
  drawFramework(); drawBuild(); drawRaceBack();
  drawGround(); art('sky + ground per level', camX + 8, camY + H - 70, 160, 60);
  drawRoad(); drawTrackLines(); drawParadeProps(); drawReturn(); drawQuiet();
  for (const b of blocks) if (!b.maze && !b.inCar && !b.follow && Math.abs(b.x - camX - W / 2) < W) drawBlock(b);
  if (state === 'end') { drawFinale(dt); return drawArtLabels(); }
  drawFollowers();

  const m = modeAt(P.x);
  // the truck: parked at either end of the road unless you're driving it
  if (camX < fw.x1 + 200 && camX + W > fw.x0 - 200 && m !== 'drive') drawCar(Math.min(driveX1, Math.max(driveX0, P.x)), G, false, carPile);
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i], a = T - p.t; if (a > 0.9) { popups.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - a / 0.9; ctx.fillStyle = '#1F6FA8'; ctx.font = '700 18px DM Sans'; ctx.textAlign = 'center';
    ctx.fillText('#' + p.n, p.x, p.y - 34 - a * 60); ctx.globalAlpha = 1;
  }
  if (state === 'title' || m === 'fly') {
    drawBanner(P.x - 48, P.y + 2, banner.map((n, i) => {
      const h = P.history[Math.min(P.history.length - 1, 6 + i * 5)] || P;
      return { n, x: P.x - 60 - (i + 1) * 30, y: h.y + Math.sin(T * 4 + i) * 3 };
    }));
    drawPlane(P.x, P.y, true, Math.max(-0.35, Math.min(0.35, P.vy / 1400)));
    art('plane + orange pilot', P.x - 55, P.y - 45, 110, 70);
  } else if (m === 'drive') {
    drawCar(P.x, P.y + CAR_FOOT, true, carPile);
  } else if (state !== 'warp') {
    const moving = keys.left !== keys.right;
    drawOrange(P.x, P.y, R, { bandana: P.x >= stp.x0, feet: P.onGround, still: !moving, dir: P.dir, squash: P.onGround ? 0 : -0.06, bob: P.onGround && moving ? -Math.abs(Math.sin(T * 12)) * 2 : 0 });
    art(P.onGround ? 'orange - run' : 'orange - jump', P.x - R, P.y - R * 1.3, R * 2, R * 2.5);
  }
  drawArtLabels();
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'title') { P.y = 250 + Math.sin(T * 2) * 20; P.x = 200; }
  T += dt;
  update(dt);
  const tx = state === 'end' ? partyX() - W / 2 : P.x - W * 0.3;
  camX += (tx - camX) * Math.min(1, dt * (state === 'end' ? 2 : 8));
  const ty = Math.min(G + 80 - H, groundY(state === 'end' ? flagX : P.x) + 80 - H);
  camY += (ty - camY) * Math.min(1, dt * 4);
  draw(dt);
  requestAnimationFrame(frame);
}
camY = G + 80 - H;
setHud('career');
{
  const lv = LEVELS.find(l => '#' + l.hash === location.hash);
  if (lv) goToLevel(lv.id);
}
requestAnimationFrame(frame);
</script>
</body>
